low */\n    .example-item, .concept-box p, .title { word-break: break-word; }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"slide-container\">\n    <div class=\"motif-line\"><\/div>\n    <h1 class=\"title\">A Calm and Healthy Morning<\/h1>\n    \n    <div class=\"main-content\">\n      <div class=\"concept-box\">\n        <h3>Starting the Day<\/h3>\n        <p>A perfect day requires a balance between responsibilities and well-being. Using modals helps express necessity and possibility.<\/p>\n      <\/div>\n      \n      <ul class=\"examples-list\" aria-hidden=\"false\">\n        <li class=\"example-item\">1. You <span class=\"modal-highlight\">must<\/span> wake up early to enjoy the sunrise and fresh air.<\/li>\n        <li class=\"example-item\">2. You <span class=\"modal-highlight\">should<\/span> drink a glass of water before having breakfast.<\/li>\n        <li class=\"example-item\">3. It <span class=\"modal-highlight\">might<\/span> be a good idea to meditate for ten minutes.<\/li>\n        <li class=\"example-item\">4. You <span class=\"modal-highlight\">could<\/span> go for a short walk in the city park.<\/li>\n        <li class=\"example-item\">5. We <span class=\"modal-highlight\">must<\/span> avoid checking our emails immediately after waking up.<\/li>\n      <\/ul>\n    <\/div>\n    \n    <div class=\"footer-note\">Phase 1: Suggestions with modals | Page 2<\/div>\n  <\/div>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Inter:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    .slide-container { \n      width: 1280px; \n      min-height: 720px; \n      background: #F9F6F0; \n      display: flex; \n      flex-direction: column;\n      font-family: 'Inter', sans-serif;\n      color: #122C34;\n      padding: 60px;\n    }\n    .motif-line { width: 80px; height: 3px tivity-title\">Social<\/div>\n        <p class=\"activity-desc\">Enjoying a long lunch with family or close friends.<\/p>\n      <\/div>\n      <div class=\"time-block\">\n        <div class=\"time-tag\">04:00 PM<\/div>\n        <div class=\"activity-title\">Leisure<\/div>\n        <p class=\"activity-desc\">Reading a book or visiting a local museum.<\/p>\n      <\/div>\n      <div class=\"time-block\">\n        <div class=\"time-tag\">08:00 PM<\/div>\n        <div class=\"activity-title\">Rest<\/div>\n        <p class=\"activity-desc\">Preparing for sleep with a digital detox routine.<\/p>\n      <\/div>\n    <\/div>\n    \n    <div class=\"footer-note\">Activity sequence | Page 3<\/div>\n  <\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <link href=\"https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Inter:wght@400;700&display=swap\" rel=\"stylesheet\">\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    .slide-container { \n      width: 1280px; \n      min-height: 720px; \n      background: #F9F6F0; \n      display: flex; \n      flex-direction: column;\n      font-family: 'Inter', sans-serif;\n      color: #122C34;\n      padding: 60px;\n    }\n    .motif-line { width: 80px; height: 3px; background: #E87A5D; margin-bottom: 16px; }\n    .title { font-family: 'Lora', serif; font-size: 48px; color: #1A4A5A; margin-bottom: 40px; }\n    .cards-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; flex: 1; }\n    .card { background: #EAE6DF; padding: 30px; border-radius: 8px; display: flex; align-items: center; }\n    .card-full { grid-column: span 2; }\n    .sentence { font-size: 24px; line-height: 1.4; }\n    .grammar-highlight { color: #E87A5D; font-weight: bold; text-decoration: underline; }\n    .footer-note { margin-top: auto; font-size: 16px; color: #4A6068; text-align: right; }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"slide-container\">\n
